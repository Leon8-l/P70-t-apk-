name: fetch-apk

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download APKs
        run: |
          mkdir -p out
          # 车来了 v4.48.2 (Android 4.4.4+)
          curl -sS -L -o out/chelaile-v4.48.2.apk "https://www.wandoujia.com/apps/5947437/history_v352" 2>&1 | head -5
          # 掌上公交 v3.3.6 (2019, Android 4.4)
          curl -sS -L -o out/zhangshangbus-v3.3.6.apk "https://www.wandoujia.com/apps/29355/history_v541" 2>&1 | head -5
          ls -lh out/
          file out/*
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bus-apks-${{ github.run_number }}
          name: "公交APP安卓4.4适配版"
          files: out/*
          token: ${{ secrets.GITHUB_TOKEN }}